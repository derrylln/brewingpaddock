name: Build

# Rebuilds the exact Cloudflare Workers bundle that Sites publishes, so a push
# that breaks the deployable output fails here instead of at publishing time.
# This job does not publish anything: Sites deploys are made with platform-owned
# credentials that are deliberately not available to this (or any) repository.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build Workers bundle
        run: npx opennextjs-cloudflare build --config freebuff.wrangler.jsonc --openNextConfigPath freebuff.open-next.config.ts

      - name: Report bundle
        run: |
          echo "manifest: $(wc -c < freebuff-sites-build/manifest.json) bytes"
          du -sh freebuff-sites-build/.open-next 2>/dev/null || true
