name: Deploy

# Push to main -> build the Workers bundle -> deploy to your own Cloudflare account.
# One-time setup (repo Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   token with Workers Scripts:Edit and R2:Edit
#   CLOUDFLARE_ACCOUNT_ID  your account id
#   GEMINI_API_KEY         optional; written to the Worker as a secret on each deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: false

permissions:
  contents: read

env:
  HAS_GEMINI_KEY: ${{ secrets.GEMINI_API_KEY != '' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build Workers bundle
        run: npx opennextjs-cloudflare build

      # Idempotent: the deploy fails later if the bucket the config binds is missing.
      - name: Ensure R2 cache bucket
        run: npx wrangler r2 bucket create brewing-paddock-cache || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy
        run: npx opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Write Gemini key to the Worker
        if: env.HAS_GEMINI_KEY == 'true'
        run: echo "$GEMINI_API_KEY" | npx wrangler secret put GEMINI_API_KEY
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
